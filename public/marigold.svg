<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" fill="none">
  <!-- Delicate editorial marigold botanical ornament in fine bronze line (#8C6A45) and soft warm washes -->
  <defs>
    <radialGradient id="marigoldBloom" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#D4AF7A" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#C29B62" stop-opacity="0.22"/>
      <stop offset="85%" stop-color="#8C6A45" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8C6A45" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="#B88A4E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8C6A45" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- Flower Head Wash -->
  <ellipse cx="80" cy="58" rx="34" ry="28" fill="url(#marigoldBloom)"/>
  <circle cx="80" cy="54" r="16" fill="url(#coreGlow)"/>

  <!-- Petals / Ruffled Marigold Layers in delicate fine bronze line -->
  <g stroke="#8C6A45" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center ruffles -->
    <path d="M78 46 C76 43, 82 42, 83 45 C85 43, 88 44, 87 47 C89 48, 88 51, 85 51 C86 53, 83 55, 80 53 C77 55, 75 52, 77 50 C74 49, 75 46, 78 46 Z" fill="none"/>
    <path d="M74 49 C71 47, 72 44, 75 44 C76 41, 81 40, 83 42 C86 40, 90 42, 89 46 C92 47, 92 51, 89 53 C90 56, 86 58, 83 56 C80 59, 76 58, 75 55 C72 55, 71 52, 74 49 Z" fill="none"/>

    <!-- Mid petal tier -->
    <path d="M68 47 C65 42, 72 38, 76 41 C79 36, 86 36, 88 40 C93 37, 98 42, 95 46 C100 48, 101 55, 96 58 C99 63, 94 68, 89 67 C86 71, 80 72, 77 68 C72 71, 67 66, 69 61 C64 59, 63 52, 67 49 C65 48, 66 47, 68 47 Z" fill="none" opacity="0.85"/>

    <!-- Outer ruffled petals -->
    <path d="M62 44 C58 39, 66 33, 72 36 C77 31, 86 31, 90 35 C97 32, 104 38, 100 44 C106 48, 108 57, 102 63 C106 70, 99 77, 92 76 C88 82, 80 82, 75 78 C68 82, 61 76, 64 69 C57 66, 56 56, 61 51 C57 48, 59 45, 62 44 Z" fill="none" opacity="0.65"/>
    
    <!-- Interior petal texture hatching lines -->
    <path d="M74 42 C76 46, 78 48, 79 50" opacity="0.5"/>
    <path d="M84 42 C83 45, 82 48, 80 50" opacity="0.5"/>
    <path d="M87 46 C85 49, 83 51, 80 52" opacity="0.5"/>
    <path d="M71 50 C74 51, 76 52, 78 52" opacity="0.5"/>
    <path d="M74 58 C76 56, 78 54, 80 53" opacity="0.5"/>
    <path d="M85 57 C83 55, 81 54, 80 53" opacity="0.5"/>
    <path d="M70 63 C73 60, 77 56, 79 55" opacity="0.4"/>
    <path d="M90 63 C87 60, 83 56, 81 55" opacity="0.4"/>
  </g>

  <!-- Calyx / Sepal base -->
  <path d="M74 77 C75 83, 77 87, 80 88 C83 87, 85 83, 86 77 C83 79, 77 79, 74 77 Z" fill="#D4AF7A" fill-opacity="0.25" stroke="#8C6A45" stroke-width="1.1" stroke-linejoin="round"/>

  <!-- Stem -->
  <path d="M80 88 C80 115, 81 145, 79 175" stroke="#8C6A45" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Pinnate marigold leaves left -->
  <g stroke="#8C6A45" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <!-- Leaf branch 1 (left) -->
    <path d="M80 118 C74 113, 67 110, 59 109"/>
    <!-- Leaflets -->
    <path d="M74 114 C73 110, 71 108, 69 108 C68 111, 71 113, 73 114" fill="#D4AF7A" fill-opacity="0.2"/>
    <path d="M68 112 C66 107, 63 106, 61 106 C61 109, 64 111, 67 112" fill="#D4AF7A" fill-opacity="0.2"/>
    <path d="M59 109 C56 107, 53 108, 52 110 C54 111, 57 111, 59 109" fill="#D4AF7A" fill-opacity="0.2"/>
    <path d="M71 113 C72 116, 71 119, 69 119 C68 117, 69 115, 71 113" fill="#D4AF7A" fill-opacity="0.15"/>
    <path d="M64 111 C64 114, 63 117, 61 116 C60 114, 62 112, 64 111" fill="#D4AF7A" fill-opacity="0.15"/>

    <!-- Leaf branch 2 (right) -->
    <path d="M80 138 C86 133, 93 131, 101 130"/>
    <!-- Leaflets -->
    <path d="M86 135 C88 131, 90 129, 92 130 C92 132, 90 134, 87 135" fill="#D4AF7A" fill-opacity="0.2"/>
    <path d="M92 133 C94 128, 97 127, 99 128 C98 130, 96 132, 93 133" fill="#D4AF7A" fill-opacity="0.2"/>
    <path d="M101 130 C104 128, 107 129, 108 131 C106 132, 103 132, 101 130" fill="#D4AF7A" fill-opacity="0.2"/>
    <path d="M89 134 C89 137, 90 140, 92 139 C92 137, 91 135, 89 134" fill="#D4AF7A" fill-opacity="0.15"/>
    <path d="M96 132 C96 135, 98 137, 99 136 C99 134, 98 133, 96 132" fill="#D4AF7A" fill-opacity="0.15"/>
  </g>
</svg>